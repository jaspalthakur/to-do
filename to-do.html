<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To‑Do · LocalStorage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f1f5f9 0%, #e6ecf4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }

        .app-card {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -8px rgba(0, 20, 30, 0.25), 0 8px 18px -6px rgba(0, 0, 0, 0.15);
            padding: 2rem 1.8rem 2rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b2b3b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
            letter-spacing: -0.02em;
        }

        h1::before {
            content: "✓";
            background: #2e7d5e;
            color: white;
            font-size: 1.6rem;
            font-weight: 600;
            width: 2.5rem;
            height: 2.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 6px 12px -4px #2e7d5e66;
        }

        .input-section {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        #taskInput {
            flex: 1;
            min-width: 200px;
            padding: 1rem 1.2rem;
            border: 2px solid #dde5ed;
            border-radius: 60px;
            font-size: 1rem;
            background: white;
            transition: border 0.15s, box-shadow 0.15s;
            outline: none;
            font-weight: 450;
            color: #132b39;
        }

        #taskInput:focus {
            border-color: #2e7d5e;
            box-shadow: 0 0 0 4px rgba(46, 125, 94, 0.15);
        }

        #taskInput::placeholder {
            color: #92a7b7;
            font-weight: 400;
        }

        #addBtn {
            background: #1f5e47;
            color: white;
            font-weight: 600;
            padding: 1rem 2rem;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 8px 16px -6px #1f5e4780;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        #addBtn:hover {
            background: #144b38;
            transform: scale(1.02);
            box-shadow: 0 10px 20px -6px #1f5e47cc;
        }

        #addBtn:active {
            transform: scale(0.98);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.75rem;
            padding: 0 0.2rem;
            font-size: 0.95rem;
            color: #2d4d5e;
            font-weight: 500;
        }

        .task-count {
            background: #e3eef7;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e4b5e;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 6px;
            margin-bottom: 0.25rem;
        }

        .task-list::-webkit-scrollbar {
            width: 6px;
        }

        .task-list::-webkit-scrollbar-track {
            background: #ecf2f8;
            border-radius: 10px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: #b7cbd9;
            border-radius: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.9rem 1.2rem;
            background: white;
            border-radius: 60px;
            border: 1px solid #e1ebf2;
            box-shadow: 0 4px 10px -6px rgba(0, 0, 0, 0.1);
            transition: all 0.15s;
            animation: fadeSlide 0.2s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-item:hover {
            border-color: #b9d2e3;
            background: #f9fcff;
        }

        .task-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #b8cfdf;
            background: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.12s;
            flex-shrink: 0;
        }

        .task-check.completed {
            background: #2e7d5e;
            border-color: #2e7d5e;
            color: white;
        }

        .task-check.completed::after {
            content: "✓";
            font-size: 14px;
            font-weight: 700;
            color: white;
        }

        .task-text {
            flex: 1;
            font-size: 1.05rem;
            font-weight: 500;
            color: #13303f;
            word-break: break-word;
            transition: color 0.15s, text-decoration 0.15s;
            cursor: pointer;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #8aa0af;
            font-weight: 400;
        }

        .delete-btn {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            line-height: 1;
            color: #b1c5d3;
            cursor: pointer;
            padding: 0 6px;
            border-radius: 30px;
            transition: all 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            color: #c7453a;
            background: #ffefed;
            transform: scale(1.1);
        }

        .empty-message {
            text-align: center;
            padding: 2.2rem 1rem;
            color: #9bb1c0;
            font-style: italic;
            font-weight: 450;
            background: #ffffffb3;
            border-radius: 60px;
            border: 1px dashed #cbdae6;
            font-size: 1.05rem;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.6rem;
            color: #839bab;
            font-size: 0.78rem;
            letter-spacing: 0.2px;
            font-weight: 450;
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            align-items: center;
        }

        .footer-note span {
            background: #dbe7f0;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="app-card">
        <h1>Task flow</h1>

        <!-- Input and add button -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Write a new task..." autofocus>
            <button id="addBtn">➕ Add task</button>
        </div>

        <!-- Stats & task list -->
        <div class="stats-bar">
            <span>📋 Your tasks</span>
            <span class="task-count" id="taskCount">0 tasks</span>
        </div>

        <ul class="task-list" id="taskList">
            <!-- dynamic tasks will be injected here -->
        </ul>

        <div class="footer-note">
            <span>💾 saved locally</span> — reload and they'll stay
        </div>
    </div>

    <script>
        (function() {
            // ---------- STATE ----------
            // Each task: { id: string, text: string, completed: boolean }
            let tasks = [];

            // ---------- LOCALSTORAGE KEY ----------
            const STORAGE_KEY = 'interactive_todo_tasks_v1';

            // ---------- DOM ELEMENTS ----------
            const taskInput = document.getElementById('taskInput');
            const addBtn = document.getElementById('addBtn');
            const taskList = document.getElementById('taskList');
            const taskCount = document.getElementById('taskCount');

            // ---------- UTILITIES ----------
            // Generate a unique id (enough for this use case)
            function generateId() {
                return Date.now() + '-' + Math.random().toString(36).substring(2, 10);
            }

            // ---------- SAVE / LOAD ----------
            function saveTasksToLocalStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                } catch (e) {
                    console.warn('Could not save to localStorage', e);
                }
            }

            function loadTasksFromLocalStorage() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            // basic validation: each item should have text and completed, id might be missing -> add
                            tasks = parsed.map(item => {
                                if (!item || typeof item !== 'object') return null;
                                const text = typeof item.text === 'string' ? item.text.trim() : '';
                                if (text === '') return null; // ignore empty text entries
                                return {
                                    id: typeof item.id === 'string' && item.id ? item.id : generateId(),
                                    text: text,
                                    completed: Boolean(item.completed)
                                };
                            }).filter(Boolean); // remove nulls
                        } else {
                            tasks = [];
                        }
                    } else {
                        // First time: start with a friendly default task
                        tasks = [
                            { id: generateId(), text: 'Click the circle to complete a task', completed: false },
                            { id: generateId(), text: 'Press “Add task” to start', completed: false },
                            { id: generateId(), text: 'Hover a task and click ✕ to delete', completed: false }
                        ];
                        // Save initial default tasks right away
                        saveTasksToLocalStorage();
                    }
                } catch (e) {
                    console.warn('Could not load from localStorage', e);
                    tasks = [];
                }
            }

            // ---------- RENDER ----------
            function render() {
                // 1. Update task counter
                const total = tasks.length;
                taskCount.textContent = total === 1 ? '1 task' : `${total} tasks`;

                // 2. Clear the list container
                taskList.innerHTML = '';

                // 3. If no tasks, show empty state message inside list
                if (tasks.length === 0) {
                    const emptyLi = document.createElement('li');
                    emptyLi.className = 'empty-message';
                    emptyLi.textContent = '✨ Your list is empty. Add a task!';
                    taskList.appendChild(emptyLi);
                    return;
                }

                // 4. Loop and create <li> for each task
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    li.dataset.id = task.id; // store id on element

                    // Check circle (toggle completion)
                    const checkSpan = document.createElement('span');
                    checkSpan.className = 'task-check' + (task.completed ? ' completed' : '');
                    checkSpan.setAttribute('role', 'button');
                    checkSpan.setAttribute('aria-label', task.completed ? 'Mark as incomplete' : 'Mark as complete');
                    checkSpan.addEventListener('click', (e) => {
                        e.stopPropagation();  // avoid any parent click (if any)
                        toggleTaskCompletion(task.id);
                    });

                    // Task text (also toggles completion on click, for convenience)
                    const textSpan = document.createElement('span');
                    textSpan.className = 'task-text' + (task.completed ? ' completed' : '');
                    textSpan.textContent = task.text;
                    textSpan.addEventListener('click', () => {
                        toggleTaskCompletion(task.id);
                    });

                    // Delete button
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerHTML = '✕';
                    delBtn.setAttribute('aria-label', 'Delete task');
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteTask(task.id);
                    });

                    li.appendChild(checkSpan);
                    li.appendChild(textSpan);
                    li.appendChild(delBtn);
                    taskList.appendChild(li);
                });
            }

            // ---------- ACTIONS (modify state, then save + render) ----------

            function addTask() {
                const rawText = taskInput.value.trim();
                if (rawText === '') {
                    // small shake effect for empty input (optional)
                    taskInput.style.borderColor = '#c7453a';
                    taskInput.style.boxShadow = '0 0 0 4px rgba(199,69,58,0.15)';
                    setTimeout(() => {
                        taskInput.style.borderColor = '#dde5ed';
                        taskInput.style.boxShadow = 'none';
                    }, 300);
                    return;
                }

                const newTask = {
                    id: generateId(),
                    text: rawText,
                    completed: false
                };
                tasks.push(newTask);
                saveTasksToLocalStorage();
                render();

                // Clear input and keep focus
                taskInput.value = '';
                taskInput.focus();
            }

            function toggleTaskCompletion(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;
                task.completed = !task.completed;
                saveTasksToLocalStorage();
                render();
            }

            function deleteTask(id) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasksToLocalStorage();
                render();
            }

            // ---------- EVENT LISTENERS ----------
            // Add button click
            addBtn.addEventListener('click', addTask);

            // Enter key in input field
            taskInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();   // prevent any form submission / accidental
                    addTask();
                }
            });

            // ---------- INITIALIZATION ----------
            function init() {
                loadTasksFromLocalStorage();
                render();
                // If there is no task, input is already autofocused via HTML
                if (tasks.length === 0) {
                    taskInput.focus();
                }
            }

            // Start the app
            init();

            // Optional: listen to storage events from other tabs (nice multi-tab sync)
            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY) {
                    loadTasksFromLocalStorage();
                    render();
                }
            });
        })();
    </script>
</body>
</html>
