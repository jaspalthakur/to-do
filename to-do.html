<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To‑Do · form version</title>
  <style>
    /* clean, minimal base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f3f6fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      line-height: 1.5;
      color: #1b2b3a;
    }

    .app {
      max-width: 520px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 18px 35px -10px rgba(0, 20, 30, 0.2), 0 6px 14px -6px rgba(0, 0, 0, 0.08);
      padding: 2rem 1.8rem 2rem 1.8rem;
      transition: all 0.2s;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #173141;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.6rem;
    }

    h1::before {
      content: "✍️";
      font-size: 1.8rem;
      line-height: 1;
    }

    /* form & input row */
    #form {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.6rem;
      flex-wrap: wrap;
    }

    #text {
      flex: 1;
      min-width: 160px;
      padding: 0.9rem 1.2rem;
      border: 2px solid #dbe4ec;
      border-radius: 60px;
      font-size: 1rem;
      background: white;
      transition: border 0.15s, box-shadow 0.15s;
      outline: none;
      font-weight: 450;
      color: #1b2b3a;
    }

    #text:focus {
      border-color: #2b6f4b;
      box-shadow: 0 0 0 4px rgba(43, 111, 75, 0.15);
    }

    #text::placeholder {
      color: #99b0c1;
      font-weight: 400;
    }

    #form button[type="submit"] {
      background: #1c5e42;
      color: white;
      font-weight: 600;
      padding: 0.9rem 2rem;
      border: none;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 8px 16px -6px #1c5e4280;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    #form button[type="submit"]:hover {
      background: #124b34;
      transform: scale(1.02);
      box-shadow: 0 10px 20px -6px #1c5e42cc;
    }

    #form button[type="submit"]:active {
      transform: scale(0.98);
    }

    /* counter */
    #count {
      color: #4f6c7e;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.9rem;
      padding-left: 0.2rem;
      background: #e2edf7;
      display: inline-block;
      padding: 0.25rem 1rem;
      border-radius: 30px;
    }

    /* task list */
    #list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 6px;
      margin-top: 0.2rem;
    }

    #list::-webkit-scrollbar {
      width: 6px;
    }

    #list::-webkit-scrollbar-track {
      background: #ecf2f8;
      border-radius: 10px;
    }

    #list::-webkit-scrollbar-thumb {
      background: #b7cbd9;
      border-radius: 10px;
    }

    /* individual task item */
    #list li {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.8rem 1.2rem;
      background: white;
      border-radius: 60px;
      border: 1px solid #e4ecf3;
      box-shadow: 0 4px 10px -6px rgba(0, 0, 0, 0.06);
      transition: all 0.15s;
      animation: fadeSlide 0.18s ease;
      flex-wrap: wrap;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #list li:hover {
      border-color: #b9d2e3;
      background: #fafdff;
    }

    /* task text */
    #list li span {
      flex: 1;
      font-size: 1.02rem;
      font-weight: 500;
      color: #15303f;
      word-break: break-word;
      transition: color 0.15s, text-decoration 0.15s;
      min-width: 120px;
    }

    /* completed state */
    #list li.done span {
      text-decoration: line-through;
      color: #8aa0af;
      font-weight: 400;
    }

    /* action buttons */
    #list li button {
      background: transparent;
      border: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.12s;
      letter-spacing: 0.2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid transparent;
    }

    /* toggle button (Done / Undo) */
    #list li button[data-action="toggle"] {
      background: #e2f0e9;
      color: #1c5e42;
      border-color: #bcdccb;
    }

    #list li button[data-action="toggle"]:hover {
      background: #cde6da;
      border-color: #8fc2a8;
      transform: scale(1.02);
    }

    /* delete button */
    #list li button[data-action="delete"] {
      background: #fcefed;
      color: #b13e32;
      border-color: #f5d6d2;
    }

    #list li button[data-action="delete"]:hover {
      background: #fadbd7;
      border-color: #e6a8a1;
      transform: scale(1.02);
    }

    /* empty state (optional, list just stays empty – but we add a friendly note via CSS pseudo?) 
       we use JS? Not needed; but we can add a style for :empty (shows only if no li) */
    #list:empty::after {
      content: "✨ No tasks yet — add one above.";
      display: block;
      text-align: center;
      padding: 2rem 1rem;
      color: #9bb1c0;
      font-style: italic;
      font-weight: 450;
      background: #ffffffb3;
      border-radius: 60px;
      border: 1px dashed #cbdae6;
      font-size: 1rem;
      width: 100%;
    }

    /* small responsive adjustment */
    @media (max-width: 450px) {
      .app {
        padding: 1.6rem 1.2rem;
      }
      h1 {
        font-size: 1.6rem;
      }
      #form button[type="submit"] {
        padding: 0.9rem 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>My tasks</h1>

    <!-- form matching app.js: id="form", input id="text" -->
    <form id="form">
      <input id="text" type="text" placeholder="Write a new task..." autocomplete="off" autofocus>
      <button type="submit">＋ Add</button>
    </form>

    <!-- counter: id="count" (will be filled with number of undone tasks) -->
    <p id="count"></p>

    <!-- task list: id="list" -->
    <ul id="list"></ul>
  </div>

  <script>
    // ============================================================
    // app.js  — exactly the code you provided, slightly formatted
    // ============================================================
    var tasks = load();
    var list = document.getElementById("list");
    var form = document.getElementById("form");
    var input = document.getElementById("text");

    function load() {
      try { return JSON.parse(localStorage.getItem("tasks")) || []; }
      catch (e) { return []; }
    }
    function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); }

    function render() {
      list.innerHTML = "";
      tasks.forEach(function (t) {
        var li = document.createElement("li");
        li.dataset.id = t.id;
        li.className = t.done ? "done" : "";
        var label = document.createElement("span");
        label.textContent = t.text;          // textContent is safe against injected HTML
        var toggle = document.createElement("button");
        toggle.textContent = t.done ? "Undo" : "Done";
        toggle.dataset.action = "toggle";
        var del = document.createElement("button");
        del.textContent = "Delete";
        del.dataset.action = "delete";
        li.append(label, toggle, del);
        list.append(li);
      });
      document.getElementById("count").textContent =
        tasks.filter(function (t) { return !t.done; }).length + " left";
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text: text, done: false });
      input.value = "";
      save(); render();
    });

    list.addEventListener("click", function (e) {
      var action = e.target.dataset.action;
      if (!action) return;
      var id = Number(e.target.closest("li").dataset.id);
      if (action === "delete") tasks = tasks.filter(function (t) { return t.id !== id; });
      if (action === "toggle") tasks.forEach(function (t) { if (t.id === id) t.done = !t.done; });
      save(); render();
    });
    render();
  </script>
</body>
</html>
